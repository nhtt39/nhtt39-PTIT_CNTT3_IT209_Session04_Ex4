<h2>Git Ignore & Commit Amend</h2>

<p>
    Bài thực hành tìm hiểu cách sử dụng
    <strong>.gitignore</strong>,
    <strong>git rm --cached</strong> và
    <strong>git commit --amend</strong>.
</p>

<ul>
    <li>Bỏ qua file nhạy cảm bằng .gitignore</li>
    <li>Gỡ file khỏi Git bằng git rm --cached</li>
    <li>Chỉnh sửa commit bằng git commit --amend</li>
</ul>
```
